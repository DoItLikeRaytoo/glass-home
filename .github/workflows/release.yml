# Baut bei jeder Änderung an app/ automatisch GlassHome.wgt und legt ein GitHub-Release an.
# Die Versionsnummer kommt aus app/config.xml (version="X.Y.Z") -> Release-Tag vX.Y.Z.
# Gibt es das Release schon, passiert nichts. Der TizenBrew Installer holt sich immer das neueste Release.
name: Release WGT
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version lesen
        id: v
        run: |
          # Version aus dem <widget>-Element (nicht aus der XML-Kopfzeile <?xml version="1.0"?>)
          VER=$(tr '\n' ' ' < app/config.xml | grep -o '<widget[^>]*' | grep -o ' version="[^"]*"' | cut -d'"' -f2)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Version: $VER"
      - name: WGT-Paket bauen
        run: cd app && zip -qr -X ../GlassHome.wgt config.xml index.html icon.png css js fonts icons
      - name: Aufräumen (versehentlich angelegtes Release v1.0 entfernen)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.0 --cleanup-tag -y || true
      - name: Release anlegen (falls neu)
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.ver }}
        run: |
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Release v$VER gibt es schon – nichts zu tun. (Für ein Update Versionsnummer in app/config.xml erhöhen.)"
          else
            gh release create "v$VER" GlassHome.wgt --target "$GITHUB_SHA" --title "Glass Home $VER" --notes "Automatisch gebaut aus $GITHUB_SHA" --latest
          fi
